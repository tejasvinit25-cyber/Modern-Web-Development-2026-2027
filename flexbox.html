<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Showcase</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center p-6">
        <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold">
            Product Showcase
        </h1>

        <p class="text-sm sm:text-base md:text-lg mt-2">
            Explore Our Latest Products
        </p>
    </header>


    <!-- Product Section -->
    <main class="p-4 sm:p-6 md:p-8 lg:p-10">

        <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-center mb-6">
            Our Products
        </h2>


        <!-- Flexbox Container -->
        <div class="flex flex-col sm:flex-row md:flex-row lg:flex-row
                    gap-4 sm:gap-5 md:gap-6 lg:gap-8
                    justify-center items-center">


            <!-- Product 1 -->
            <div class="bg-white w-full sm:w-72 md:w-64 lg:w-72
                        p-4 sm:p-5 md:p-6
                        rounded-lg shadow text-center">

                <img
                    src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                    alt="Smart Watch"
                    class="w-full h-40 sm:h-44 md:h-48 lg:h-52
                           object-cover rounded">

                <h3 class="text-lg sm:text-xl md:text-2xl font-bold mt-4">
                    Smart Watch
                </h3>

                <p class="text-sm sm:text-base text-gray-600 mt-2">
                    Stylish smartwatch with useful features.
                </p>

                <p class="text-lg sm:text-xl font-bold text-blue-600 mt-3">
                    ₹2,999
                </p>

                <button
                    class="bg-blue-600 text-white
                           text-sm sm:text-base
                           px-4 sm:px-5 py-2 mt-3
                           rounded hover:bg-blue-700">
                    Buy Now
                </button>

            </div>


            <!-- Product 2 -->
            <div class="bg-white w-full sm:w-72 md:w-64 lg:w-72
                        p-4 sm:p-5 md:p-6
                        rounded-lg shadow text-center">

                <img
                    src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                    alt="Headphones"
                    class="w-full h-40 sm:h-44 md:h-48 lg:h-52
                           object-cover rounded">

                <h3 class="text-lg sm:text-xl md:text-2xl font-bold mt-4">
                    Headphones
                </h3>

                <p class="text-sm sm:text-base text-gray-600 mt-2">
                    Comfortable headphones with clear sound.
                </p>

                <p class="text-lg sm:text-xl font-bold text-blue-600 mt-3">
                    ₹1,999
                </p>

                <button
                    class="bg-blue-600 text-white
                           text-sm sm:text-base
                           px-4 sm:px-5 py-2 mt-3
                           rounded hover:bg-blue-700">
                    Buy Now
                </button>

            </div>


            <!-- Product 3 -->
            <div class="bg-white w-full sm:w-72 md:w-64 lg:w-72
                        p-4 sm:p-5 md:p-6
                        rounded-lg shadow text-center">

                <img
                    src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
                    alt="Laptop"
                    class="w-full h-40 sm:h-44 md:h-48 lg:h-52
                           object-cover rounded">

                <h3 class="text-lg sm:text-xl md:text-2xl font-bold mt-4">
                    Laptop
                </h3>

                <p class="text-sm sm:text-base text-gray-600 mt-2">
                    Powerful laptop for work and study.
                </p>

                <p class="text-lg sm:text-xl font-bold text-blue-600 mt-3">
                    ₹49,999
                </p>

                <button
                    class="bg-blue-600 text-white
                           text-sm sm:text-base
                           px-4 sm:px-5 py-2 mt-3
                           rounded hover:bg-blue-700">
                    Buy Now
                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4 mt-6">
        <p class="text-sm sm:text-base">
            © 2026 Product Showcase
        </p>
    </footer>

</body>
</html>
