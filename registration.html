<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 
             flex items-center justify-center p-5">

    <!-- Main Card -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">

        <!-- Heading -->
        <div class="text-center mb-7">

            <div class="text-5xl mb-3">
                🎓
            </div>

            <h1 class="text-3xl font-bold text-gray-800">
                Student Registration
            </h1>
            <br>
            <h2>Tejasvi Nagtode(IT25113)</h2>

            <p class="text-gray-500 mt-2">
                Create your student account
            </p>

        </div>


        <!-- Registration Form -->
        <form id="registrationForm">

            <!-- Full Name -->
            <div class="mb-4">

                <label class="block text-gray-700 font-semibold mb-2">
                    👤 Full Name
                </label>

                <input type="text" id="name"
                    placeholder="Enter your full name"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl
                    focus:outline-none focus:ring-2 focus:ring-blue-400">

                <p id="nameError" class="text-red-500 text-sm mt-1"></p>

            </div>


            <!-- Email -->
            <div class="mb-4">

                <label class="block text-gray-700 font-semibold mb-2">
                    📧 Email Address
                </label>

                <input type="text" id="email"
                    placeholder="example@gmail.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl
                    focus:outline-none focus:ring-2 focus:ring-blue-400">

                <p id="emailError" class="text-red-500 text-sm mt-1"></p>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="block text-gray-700 font-semibold mb-2">
                    🔒 Password
                </label>

                <input type="password" id="password"
                    placeholder="Enter password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl
                    focus:outline-none focus:ring-2 focus:ring-blue-400">

                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>

            </div>


            <!-- Mobile Number -->
            <div class="mb-6">

                <label class="block text-gray-700 font-semibold mb-2">
                    📱 Mobile Number
                </label>

                <input type="text" id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl
                    focus:outline-none focus:ring-2 focus:ring-blue-400">

                <p id="mobileError" class="text-red-500 text-sm mt-1"></p>

            </div>


            <!-- Register Button -->
            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600
                text-white font-semibold py-3 rounded-xl
                hover:from-blue-700 hover:to-purple-700
                transition duration-300 shadow-lg">

                Create Account →

            </button>


            <!-- Success Message -->
            <p id="successMessage"
                class="text-green-600 text-center font-semibold mt-5">
            </p>

        </form>

    </div>


    <!-- JavaScript -->
    <script>

        // Get form
        const form = document.getElementById("registrationForm");


        // Submit event
        form.addEventListener("submit", function(event) {

            // Prevent default form submission
            event.preventDefault();


            // Get values
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value.trim();


            // Get error elements
            let nameError = document.getElementById("nameError");
            let emailError = document.getElementById("emailError");
            let passwordError = document.getElementById("passwordError");
            let mobileError = document.getElementById("mobileError");
            let successMessage = document.getElementById("successMessage");


            // Clear old messages
            nameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            mobileError.textContent = "";
            successMessage.textContent = "";


            let valid = true;


            // Name validation
            if (name === "") {

                nameError.textContent = "Please enter your name.";
                valid = false;

            }


            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                emailError.textContent = "Please enter your email.";
                valid = false;

            }
            else if (!emailPattern.test(email)) {

                emailError.textContent = "Please enter a valid email.";
                valid = false;

            }


            // Password validation
            if (password === "") {

                passwordError.textContent = "Please enter your password.";
                valid = false;

            }
            else if (password.length < 6) {

                passwordError.textContent =
                    "Password must be at least 6 characters.";

                valid = false;

            }


            // Mobile validation
            let mobilePattern = /^[0-9]{10}$/;

            if (mobile === "") {

                mobileError.textContent =
                    "Please enter your mobile number.";

                valid = false;

            }
            else if (!mobilePattern.test(mobile)) {

                mobileError.textContent =
                    "Mobile number must contain 10 digits.";

                valid = false;

            }


            // Final result
            if (valid) {

                successMessage.textContent =
                    "✓ Registration successful!";

            }

        });

    </script>

</body>

</html>
